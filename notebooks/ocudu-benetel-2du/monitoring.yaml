# Monitoring runs on the VM node11: the CPUs of the RAN nodes sopnode-f3 and sopnode-f4 are isolated for the DUs.
# ran_kpis and csi change the RAN: the notebook calls configure_ran_monitoring(ran, config) before ran.deploy().
namespace: monitoring
node_name: node11
metrics:
  ran:
    # OCUDU JSON metrics of every OCUDU component on its remote control server (ocudu-metrics chart)
    ran_kpis: {ocudu_port: 8001}
    # du01 only: sopnode-f4 (du02) has no data disk for the CSI file
    csi:
      components: [du01]
      srs_period_ms: 40
      granularity: rb
      subcarrier_sampling: 1
      antennas: all
      ports: all
      output_dir: null  # /mnt/csi, the only hostPath of the OCUDU charts
    split_signaling: false
    logs: true
  core:
    ngap: false
    pfcp: false
    throughput: {on_demand: false}
    upf_transit: false
    ue_mapper_coverage: false
    logs: true
  e2e:
    rtt: {on_demand: false, at: [gnb, upf], packet_pairing: true, imsis: [], slices: []}
    n3_one_way: false
    user_plane_paths: false
  host:
    node_metrics: false
    logs: true
    scheduler_wait: false
    kernel_drops: false
    attributed_drops: false
    network_queues: false
    socket_counters: false
    tcp_flows: false
    measurement_quality: false
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: cuup
  role: gnb
  container: cuup
  interface: eth0
