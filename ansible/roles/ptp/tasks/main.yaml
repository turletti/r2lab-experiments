---
# PTP role: linuxptp built from source, ptp4l slave on the PTP interface and phc2sys to the system clock

# Input:
# - miscellaneous.ptp.<node>: PTP parameters of the node ('interface' required, others in defaults/main.yaml)

# Output: None

- name: Skip the nodes without PTP parameters
  ansible.builtin.meta: end_host
  when: inventory_hostname not in ((miscellaneous | default({}, true)).ptp | default({}, true))

- name: Set the PTP parameters
  ansible.builtin.set_fact:
    ptp: "{{ ptp_defaults | combine(miscellaneous.ptp[inventory_hostname]) }}"

- name: Check the PTP interface
  ansible.builtin.assert:
    that: ptp.interface is defined
    fail_msg: "miscellaneous.ptp.{{ inventory_hostname }} has no 'interface'."

- name: Install the linuxptp build dependencies
  ansible.builtin.apt:
    name:
      - gcc
      - make
      - git
    state: present
    update_cache: true

- name: Clone linuxptp
  ansible.builtin.git:
    repo: "{{ ptp.linuxptp_repository }}"
    dest: /usr/local/src/linuxptp
    version: "{{ ptp.linuxptp_version }}"
    depth: 1
    force: true
  register: linuxptp_clone

# Always run: an unchanged clone does not mean that a previous build succeeded (make only rebuilds what changed)
- name: Build and install linuxptp in /usr/local/sbin
  ansible.builtin.shell: |
    make -j"$(nproc)"
    make install
  args:
    chdir: /usr/local/src/linuxptp
  changed_when: false

# phc2sys drives the system clock, NTP must not fight it
- name: Disable NTP
  ansible.builtin.command: timedatectl set-ntp false
  changed_when: false

- name: Write the ptp4l configuration
  ansible.builtin.template:
    src: ptp4l.conf.j2
    dest: /etc/ptp4l.conf
    mode: "0644"
  register: ptp4l_conf

- name: Install the ptp4l and phc2sys systemd units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    mode: "0644"
  loop:
    - ptp4l
    - phc2sys
  register: ptp_units

- name: Enable and (re)start ptp4l and phc2sys
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if (linuxptp_clone is changed or ptp4l_conf is changed or ptp_units is changed) else 'started' }}"
  loop:
    - ptp4l
    - phc2sys
