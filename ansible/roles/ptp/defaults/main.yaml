---
# Default PTP parameters, overridden per node by miscellaneous.ptp.<node> (which must give 'interface')
ptp_defaults:
  # linuxptp built from source, so that every node runs the same version whatever its OS release
  linuxptp_repository: https://github.com/nwtime/linuxptp.git
  linuxptp_version: v4.4
  # ptp4l [global] section
  domain_number: 24
  slave_only: 1
  time_stamping: hardware
  tx_timestamp_timeout: 100
  logging_level: 6
  summary_interval: 0
  log_announce_interval: 1
  log_sync_interval: -4
  verbose: 1
  # ptp4l interface section
  network_transport: L2
  # phc2sys log level
  phc2sys_logging_level: 7
