# Set CPU frequency governors to performance and raise RCU callback thread priority.
---
- name: Find CPU frequency governor controls
  ansible.builtin.find:
    paths: /sys/devices/system/cpu
    patterns: scaling_governor
    recurse: true
    file_type: file
  register: fhi72_governors

# One cat reads every governor and one tee writes the ones to change: two tasks instead of two per CPU
- name: Read current CPU governors
  ansible.builtin.command:
    argv: "{{ ['cat'] + fhi72_governors.files | map(attribute='path') | list }}"
  register: fhi72_governor_values
  changed_when: false

- name: Select CPU governors to change
  ansible.builtin.set_fact:
    fhi72_governors_to_set: >-
      {{ fhi72_governors.files | map(attribute='path') | zip(fhi72_governor_values.stdout_lines)
         | rejectattr('1', 'equalto', 'performance') | map(attribute='0') | list }}

- name: Set performance CPU governor
  ansible.builtin.command:
    argv: "{{ ['tee'] + fhi72_governors_to_set }}"
    stdin: performance
  when: fhi72_governors_to_set | length > 0
  changed_when: true

# One ps reads the scheduling of every thread and one xargs runs chrt on the RCU threads to change
- name: Read RCU callback thread scheduling
  ansible.builtin.command:
    argv: [ps, -eo, "pid=,cls=,rtprio=,comm="]
  register: fhi72_threads
  changed_when: false

- name: Select RCU callback threads to raise
  vars:
    # [pid, class, rtprio, command] of each RCU callback thread
    fhi72_rcu_threads: >-
      {{ fhi72_threads.stdout_lines | map('split') | selectattr('3', 'defined') | selectattr('3', 'match', 'rcu[cb]/') | list }}
  ansible.builtin.set_fact:
    fhi72_rcu_to_raise: >-
      {{ fhi72_rcu_threads | rejectattr('1', 'equalto', 'FF') | map(attribute='0') | list
         + fhi72_rcu_threads | selectattr('1', 'equalto', 'FF') | rejectattr('2', 'equalto', '99') | map(attribute='0') | list }}

- name: Set RCU callback thread priority to FIFO 99
  ansible.builtin.command:
    argv: [xargs, -n, "1", chrt, -f, -p, "99"]
    stdin: "{{ fhi72_rcu_to_raise | join('\n') }}"
  when: fhi72_rcu_to_raise | length > 0
  changed_when: true
