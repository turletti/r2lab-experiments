# Build UHD 4.7 and GNU Radio (uhd_siggen) in install_prefix: the 5g_ansible setup/uhd-gnuradio role, built only
# when libuhd 4.7 or this GNU Radio version is missing, with the VOLK package of the Ubuntu release
---
- name: Read the installed GNU Radio version
  ansible.builtin.shell: "{{ install_prefix }}/bin/gnuradio-config-info --version || echo none"
  args:
    executable: /bin/bash
  environment:
    LD_LIBRARY_PATH: "{{ install_prefix }}/lib"
  register: uhd_gnuradio_installed
  changed_when: false

- name: Check libuhd 4.7
  ansible.builtin.stat:
    path: "{{ install_prefix }}/lib/libuhd.so.4.7.0"
  register: uhd_gnuradio_libuhd

- name: Build UHD and GNU Radio
  when: not uhd_gnuradio_libuhd.stat.exists or uhd_gnuradio_installed.stdout | trim != gnuradio_version
  block:
    # GNU Radio must link the UHD built here, not a system libuhd
    - name: Remove the system UHD libraries
      ansible.builtin.shell: |
        apt-get remove --purge -y libuhd4.1.0 libuhd-dev uhd-host 2>/dev/null || true
        find /usr/lib /lib -name "libuhd*.so*" -delete 2>/dev/null || true
        ldconfig
      args:
        executable: /bin/bash
      changed_when: true

    - name: Install the build dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - cmake
          - git
          - python3-dev
          - python3-numpy
          - python3-mako
          - python3-yaml
          - python3-click
          - python3-click-plugins
          - python3-zmq
          - python3-scipy
          - python3-packaging
          - python3-jsonschema
          - python3-pybind11
          - python3-pyqt5
          - pyqt5-dev-tools
          - qtbase5-dev
          - libqt5opengl5-dev
          - libqt5svg5-dev
          - libqwt-qt5-dev
          - python3-gi
          - python3-gi-cairo
          - gir1.2-gtk-3.0
          - libboost-all-dev
          - libgmp-dev
          - libfftw3-dev
          - libusb-1.0-0-dev
          # libvolk2-dev up to Ubuntu 22.04 (jammy), libvolk-dev from 24.04 (noble, the POS default image)
          - "{{ 'libvolk2-dev' if ansible_facts['distribution_release'] == 'jammy' else 'libvolk-dev' }}"
          - libspdlog-dev
          - libthrift-dev
          - thrift-compiler
        state: present
        update_cache: true

    - name: Clone UHD
      ansible.builtin.git:
        repo: https://github.com/EttusResearch/uhd.git
        version: "{{ uhd_version }}"
        dest: "{{ uhd_src_dir }}"
        depth: 1
        force: true

    - name: Build and install UHD
      ansible.builtin.shell: |
        set -e
        mkdir -p {{ uhd_src_dir }}/host/build
        cd {{ uhd_src_dir }}/host/build
        cmake ../ -DCMAKE_INSTALL_PREFIX={{ install_prefix }} -DENABLE_PYTHON_API=ON -DENABLE_TESTS=OFF
        make -j{{ make_jobs }}
        make install
        ldconfig
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clone GNU Radio
      ansible.builtin.git:
        repo: https://github.com/gnuradio/gnuradio.git
        version: "v{{ gnuradio_version }}"
        dest: "{{ gnuradio_src_dir }}"
        depth: 1
        force: true

    - name: Build and install GNU Radio against this UHD
      ansible.builtin.shell: |
        set -e
        mkdir -p {{ gnuradio_src_dir }}/build
        cd {{ gnuradio_src_dir }}/build
        ldconfig
        cmake ../ \
          -DCMAKE_INSTALL_PREFIX={{ install_prefix }} \
          -DCMAKE_PREFIX_PATH={{ install_prefix }} \
          -DCMAKE_LIBRARY_PATH={{ install_prefix }}/lib \
          -DCMAKE_INCLUDE_PATH={{ install_prefix }}/include \
          -DUHD_DIR={{ install_prefix }}/lib/cmake/uhd \
          -DUHD_LIBRARIES={{ install_prefix }}/lib/libuhd.so \
          -DUHD_INCLUDE_DIRS={{ install_prefix }}/include \
          -DENABLE_DEFAULT=OFF \
          -DENABLE_GNURADIO_RUNTIME=ON \
          -DENABLE_PYTHON=ON \
          -DENABLE_GRC=ON \
          -DENABLE_GR_QTGUI=ON \
          -DENABLE_GR_BLOCKS=ON \
          -DENABLE_GR_ANALOG=ON \
          -DENABLE_GR_FFT=ON \
          -DENABLE_GR_FILTER=ON \
          -DENABLE_GR_DIGITAL=ON \
          -DENABLE_GR_UHD=ON \
          -DENABLE_TESTING=OFF \
          -DENABLE_DOXYGEN=OFF
        make -j{{ make_jobs }}
        make install
        ldconfig
      args:
        executable: /bin/bash
      changed_when: true

    - name: Add the install prefix to the library cache
      ansible.builtin.copy:
        dest: /etc/ld.so.conf.d/usr_local.conf
        content: "{{ install_prefix }}/lib\n"
        mode: "0644"

    - name: Reload the library cache
      ansible.builtin.command: ldconfig
      changed_when: true

# Same environment as r2lab_experiments.interference.UHD_ENVIRONMENT
- name: Check uhd_siggen with this UHD and GNU Radio
  ansible.builtin.shell: |
    set -o pipefail
    export PYTHONPATH=$(ls -d {{ install_prefix }}/lib/python3*/dist-packages | paste -sd:)
    {{ install_prefix }}/bin/uhd_siggen --help | head -1
  args:
    executable: /bin/bash
  environment:
    LD_LIBRARY_PATH: "{{ install_prefix }}/lib"
    LD_PRELOAD: "{{ install_prefix }}/lib/libuhd.so.4.7.0"
  changed_when: false
